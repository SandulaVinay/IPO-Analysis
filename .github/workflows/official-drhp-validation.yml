name: Live Official DRHP Extraction Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "src/documents/**"
      - "scripts/validate_official_esds_drhp.py"
      - ".github/workflows/official-drhp-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-official-drhp-validation
  cancel-in-progress: true

jobs:
  validate-esds-drhp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Download and validate the official SEBI DRHP
        run: python scripts/validate_official_esds_drhp.py
      - name: Upload live validation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: esds-official-drhp-live-validation
          path: reports/prospectus/ESDS_DRHP_live_validation.json
          if-no-files-found: warn
          retention-days: 14

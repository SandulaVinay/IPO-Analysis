name: IPO Email Delivery Test

on:
  workflow_dispatch:
    inputs:
      recipient_emails:
        description: "Comma-separated test recipients; defaults to the two alternate addresses requested"
        required: false
        type: string
        default: "sandulavinay@gmail.com,stu.vinay.sandula@gmail.com"

jobs:
  test-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Send Real SMTP Test Email
        env:
          APP_ENV: production
          ENABLE_EMAIL: ${{ secrets.ENABLE_EMAIL }}
          EMAIL_PROVIDER: smtp
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM || secrets.SMTP_USER }}
          EMAIL_TO: ${{ inputs.recipient_emails != '' && inputs.recipient_emails || secrets.EMAIL_TO }}
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/test_email.py
